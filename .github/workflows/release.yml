name: Create Release

# Prevent concurrent release generation
concurrency:
  group: release
  cancel-in-progress: false

on:
  push:
    branches: [master, dev]
    paths:
      - "style/**"
      - "figures/**"
      - ".github/workflows/release.yml"
      - "package.json"
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"  # Full semver tags only (exclude floating vX.Y tags)
  pull_request:
    branches: [master, dev]
    paths:
      - "style/**"
      - "figures/**"
      - ".github/workflows/release.yml"
      - "package.json"
  release:
    types: [published]   # release-please draft published → attach CTAN/PDF assets
  workflow_dispatch: # Allow manual triggering

jobs:
  # Build CTAN package and source archives (runs on every trigger)
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract package metadata
        id: metadata
        run: |
          VERSION=$(jq -r '.version' package.json)
          AUTHOR=$(jq -r '.author // "TJ-CSCCG"' package.json)
          YEAR=$(date +%Y)

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "author=$AUTHOR" >> "$GITHUB_OUTPUT"

          {
            echo "PACKAGE_VERSION=$VERSION"
            echo "PACKAGE_AUTHOR=$AUTHOR"
            echo "CURRENT_YEAR=$YEAR"
          } >> "$GITHUB_ENV"

          echo "Package version: $VERSION, author: $AUTHOR"

      # File set + generated LICENSE/README/MANIFEST/example live in
      # scripts/build-ctan.sh, shared with test.yaml's build-ctan job so the
      # packaged files and the compile check that proves they work cannot drift.
      - name: Build and validate CTAN package
        run: scripts/build-ctan.sh

      - name: Create source archives
        run: |
          EXCLUDES=(
            .git main.pdf ctan/ _out/ _minted*
            '*.aux' '*.log' '*.out' '*.toc' '*.bbl' '*.bcf' '*.blg'
            '*.fls' '*.fdb_latexmk' '*.run.xml' '*.synctex.gz' '*.xdv' '*.pyg'
            '*.tar.gz' '*.zip'
          )

          # Build tar exclude flags
          TAR_EXCLUDES=""
          for e in "${EXCLUDES[@]}"; do TAR_EXCLUDES="$TAR_EXCLUDES --exclude=$e"; done

          # Create archives in /tmp to avoid "file changed as we read it"
          tar -czf "/tmp/tongjithesis-source-v${PACKAGE_VERSION}.tar.gz" $TAR_EXCLUDES .

          # Build zip exclude flags as array
          ZIP_EXCLUDES=()
          for e in "${EXCLUDES[@]}"; do ZIP_EXCLUDES+=(-x "./$e" -x "./$e/*"); done

          zip -r "/tmp/tongjithesis-source-v${PACKAGE_VERSION}.zip" . "${ZIP_EXCLUDES[@]}"

          # Move back to workspace
          mv /tmp/tongjithesis-source-v${PACKAGE_VERSION}.* .

          echo "Source archives created:"
          ls -la tongjithesis-source-v${PACKAGE_VERSION}.*

      - name: Create CTAN archives
        run: |
          cd ctan
          tar -czf "tongjithesis-ctan-v${PACKAGE_VERSION}.tar.gz" tongjithesis/
          zip -r "tongjithesis-ctan-v${PACKAGE_VERSION}.zip" tongjithesis/
          echo "CTAN archives created:"
          ls -la tongjithesis-ctan-v${PACKAGE_VERSION}.*

      - name: Validate archives
        run: |
          # Check source archive contains key files
          echo "Source archive contents (key files):"
          tar -tzf "tongjithesis-source-v${PACKAGE_VERSION}.tar.gz" | grep -E "(main\.tex|style/|figures/tongji\.pdf|README\.md)" || echo "Warning: Expected files not found"

          # Check source archive excludes build artifacts
          if tar -tzf "tongjithesis-source-v${PACKAGE_VERSION}.tar.gz" | grep -E "\.(aux|log|out|toc|bbl)$"; then
            echo "Warning: Build artifacts found in source archive"
          else
            echo "No build artifacts in source archive"
          fi

          # Check CTAN archive
          echo "CTAN archive contents:"
          tar -tzf "ctan/tongjithesis-ctan-v${PACKAGE_VERSION}.tar.gz"

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-packages-v${{ env.PACKAGE_VERSION }}
          path: |
            ctan/tongjithesis-ctan-v${{ env.PACKAGE_VERSION }}.tar.gz
            ctan/tongjithesis-ctan-v${{ env.PACKAGE_VERSION }}.zip
            tongjithesis-source-v${{ env.PACKAGE_VERSION }}.tar.gz
            tongjithesis-source-v${{ env.PACKAGE_VERSION }}.zip
            ctan/tongjithesis/
          retention-days: 90

  # Attach CTAN archives to the release created & published by release-please.
  # release-please owns release creation + the CHANGELOG body; this job only
  # uploads build artifacts to the existing release and moves the floating vX.Y tag.
  release:
    needs: package
    # release-please-published releases only — never workflow_dispatch, so this job can
    # never accidentally publish a still-under-review draft (softprops publishes any
    # draft it's pointed at unless draft: true is set) or move a tag before it exists.
    # needs.package is gated explicitly: a custom job-level if: is evaluated in place of
    # the default success(), so without this the job would start after a failed package
    # job and die at "Download package artifacts", leaving a published release with no
    # assets attached.
    if: |
      github.event_name == 'release' &&
      startsWith(github.event.release.tag_name, 'v') &&
      needs.package.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      PACKAGE_VERSION: ${{ needs.package.outputs.version }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download package artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-packages-v${{ env.PACKAGE_VERSION }}

      - name: Attach CTAN archives to the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          # No body/name: release-please already wrote them; softprops leaves them intact.
          # PDFs are attached separately by test.yaml's build-release-pdfs job (no cross-workflow race).
          files: |
            ctan/tongjithesis-ctan-v${{ env.PACKAGE_VERSION }}.tar.gz
            ctan/tongjithesis-ctan-v${{ env.PACKAGE_VERSION }}.zip
          fail_on_unmatched_files: false
          make_latest: true

      - name: Move floating vX.Y tag to the release
        run: |
          SHORT="${RELEASE_TAG%.*}"
          git tag -f "$SHORT" "$RELEASE_TAG"
          git push -f origin "$SHORT"
